apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-service-config
data:
  NODE_ENV: production
  PORT: "3001"
  ACTIVATION_URL_BASE: http://bank-usac.local/api/auth/activate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: bank-usac/customer-service:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: customer-service-config
            - secretRef:
                name: customer-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  selector:
    app: customer-service
  ports:
    - port: 80
      targetPort: 3001
