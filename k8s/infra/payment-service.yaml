apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
    spec:
      containers:
      - name: payment-service
        image: bank-usac/payment-service:v1.0.0
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: observability-env
        env:
        - name: DATABASE_URL
          value: "postgresql://bankadmin:SA_Grupo11@10.0.2.4:5432/db_payment?schema=public"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
        - name: JWT_SECRET
          value: "local-dev-jwt-secret-change-before-production-local-12345"
        livenessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  - name: metrics
    port: 9464
    targetPort: 9464
  selector:
    app: payment-service
