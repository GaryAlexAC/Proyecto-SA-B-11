apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
      - name: account-service
        image: bank-usac/account-service:v1.0.0
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgresql://bankadmin:SA_Grupo11@10.0.2.4:5432/db_account?schema=public"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
        - name: JWT_SECRET
          value: "local-dev-jwt-secret-change-before-production-local-12345"
        # SRE: Health probes prevent traffic to pods that aren't ready
        livenessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: account-service
