apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
    spec:
      containers:
      - name: api-gateway
        image: bank-usac/api-gateway:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        - containerPort: 9464
          name: metrics
        envFrom:
        - configMapRef:
            name: observability-env
        env:
        - name: PORT
          value: "3000"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
        - name: FRONTEND_URL
          value: "*"
        - name: CUSTOMER_SERVICE_HTTP_URL
          value: "http://customer-service:3001"
        - name: JWT_SECRET
          value: "local-dev-jwt-secret-change-before-production-local-12345"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
# Internal ClusterIP — other pods reference gateway internally
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  - name: metrics
    port: 9464
    targetPort: 9464
  selector:
    app: api-gateway
---
# NodePort — exposes the gateway externally so the frontend and testers can hit it
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-external
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
  - name: metrics
    port: 9464
    targetPort: 9464
  selector:
    app: api-gateway
