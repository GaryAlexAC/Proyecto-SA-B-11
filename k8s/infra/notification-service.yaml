apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: bank-usac/notification-service:v1.0.0
        imagePullPolicy: Always
        env:
        - name: DATABASE_URL
          value: "postgresql://bankadmin:SA_Grupo11@10.0.2.4:5432/db_notification?schema=public"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
        # Credenciales para envío real de correos (Nodemailer + Gmail)
        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: email-credentials
              key: email-user
              optional: true
        - name: EMAIL_APP_PASS
          valueFrom:
            secretKeyRef:
              name: email-credentials
              key: email-app-pass
              optional: true
        livenessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: notification-service
