apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            tags: [service.name, deployment.environment]
          serviceMap:
            datasourceUid: prometheus
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Bank USAC
        orgId: 1
        folder: Bank USAC
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  bank-usac-overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {"type": "stat", "title": "Errores por minuto", "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}, "targets": [{"expr": "sum(rate(bank_errors_total[5m])) or vector(0)", "refId": "A"}]},
        {"type": "stat", "title": "Throughput", "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}, "targets": [{"expr": "sum(rate(bank_requests_total[5m])) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Latencia p95", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(transaction_duration_ms_bucket[5m]))) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Requests de lectura p95", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 60}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(bank_operation_duration_ms_bucket{service_name=\"api-gateway\",operation=~\"GET .*\"}[5m]))) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Creación de operación p95", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 60}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(bank_operation_duration_ms_bucket{service_name=\"api-gateway\",operation=~\"POST .*|PUT .*|PATCH .*\"}[5m]))) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Anomalías de cuentas", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}, "targets": [{"expr": "sum by (operation) (increase(account_anomalies_detected_total[1h])) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Duración general p95", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(bank_operation_duration_ms_bucket[5m]))) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Transacciones exitosas y fallidas", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12}, "targets": [{"expr": "sum(rate(transaction_success_total[5m])) or vector(0)", "legendFormat": "Éxitos", "refId": "A"}, {"expr": "sum(rate(transaction_failures_total[5m])) or vector(0)", "legendFormat": "Fallos", "refId": "B"}]},
        {"type": "timeseries", "title": "Débitos y créditos", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20}, "targets": [{"expr": "sum by (operation) (rate(account_transactions_total[5m])) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "KYC aprobados y rechazados", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20}, "targets": [{"expr": "sum(rate(customer_kyc_verified_total[5m])) or vector(0)", "legendFormat": "Aprobados", "refId": "A"}, {"expr": "sum(rate(customer_kyc_rejected_total[5m])) or vector(0)", "legendFormat": "Rechazados", "refId": "B"}]},
        {"type": "timeseries", "title": "Duración KYC p95", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(customer_kyc_duration_ms_bucket[5m]))) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Fallos externos de Payment", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28}, "targets": [{"expr": "sum by (failure_type) (rate(payment_external_failures_total[5m])) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Latencia externa Payment p95", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 36}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(payment_external_latency_ms_bucket[5m]))) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Mensajes pendientes RabbitMQ", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 36}, "targets": [{"expr": "sum(rabbitmq_queue_messages_ready) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Eventos procesados antes de 5s", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 44}, "targets": [{"expr": "100 * sum(rate(bank_event_processing_duration_ms_bucket{le=\"5000\"}[5m])) / clamp_min(sum(rate(bank_event_processing_duration_ms_count[5m])), 1) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Notificaciones procesadas antes de 30s", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 44}, "targets": [{"expr": "100 * sum(rate(bank_notification_processing_duration_ms_bucket{le=\"30000\"}[5m])) / clamp_min(sum(rate(bank_notification_processing_duration_ms_count[5m])), 1) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Tasa de DLQ lógica", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 52}, "targets": [{"expr": "100 * sum(rate(bank_events_dlq_total[5m])) / clamp_min(sum(rate(bank_events_published_total[5m])), 1) or vector(0)", "refId": "A"}]}
      ],
      "schemaVersion": 39,
      "title": "Bank USAC - Estado y SLI",
      "uid": "bank-usac-overview",
      "version": 1
    }
