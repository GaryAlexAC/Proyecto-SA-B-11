apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  labels:
    app: customer-service
spec:
  replicas: {{ .Values.services.customerService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.services.customerService.metricsPort | default 9464 | quote }}
    spec:
      containers:
      - name: customer-service
        image: "{{ .Values.imageRegistry }}/customer-service:{{ .Values.imageTag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
        envFrom:
        - configMapRef:
            name: observability-env
        ports:
        - containerPort: 3001
        - containerPort: {{ .Values.services.customerService.metricsPort | default 9464 }}
          name: metrics
        env:
        - name: DATABASE_URL
          value: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/db_customer?schema={{ .Values.database.schema }}"
        - name: RABBITMQ_URL
          value: "amqp://{{ .Values.rabbitmq.user }}:{{ .Values.rabbitmq.password }}@{{ .Values.rabbitmq.host }}:{{ .Values.rabbitmq.port }}"
        - name: PORT
          value: "3001"
        - name: JWT_SECRET
          value: {{ .Values.jwt.secret | quote }}
        - name: JWT_EXPIRES_IN
          value: {{ .Values.jwt.expiresIn | quote }}
        - name: ACTIVATION_URL_BASE
          value: "http://api-gateway:3000/"
        - name: ACTIVATION_TOKEN_TTL_HOURS
          value: "24"
        - name: ADMIN_USERNAME
          value: "admin"
        - name: ADMIN_PASSWORD
          value: "ChangeMe123"
        - name: ADMIN_NAME
          value: "Bank USAC Admin"
        - name: ADMIN_EMAIL
          value: "admin@bankusac.local"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
  - name: metrics
    port: {{ .Values.services.customerService.metricsPort | default 9464 }}
    targetPort: {{ .Values.services.customerService.metricsPort | default 9464 }}
  selector:
    app: customer-service
