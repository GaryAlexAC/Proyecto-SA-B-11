apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: {{ .Values.services.notificationService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.services.notificationService.metricsPort | default 9464 | quote }}
    spec:
      containers:
      - name: notification-service
        image: "{{ .Values.imageRegistry }}/notification-service:{{ .Values.imageTag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
        envFrom:
        - configMapRef:
            name: observability-env
        ports:
        - containerPort: 3000
        - containerPort: {{ .Values.services.notificationService.metricsPort | default 9464 }}
          name: metrics
        env:
        - name: DATABASE_URL
          value: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/db_notification?schema={{ .Values.database.schema }}"
        - name: RABBITMQ_URL
          value: "amqp://{{ .Values.rabbitmq.user }}:{{ .Values.rabbitmq.password }}@{{ .Values.rabbitmq.host }}:{{ .Values.rabbitmq.port }}"
        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: email-credentials
              key: email-user
              optional: true
        - name: EMAIL_APP_PASS
          valueFrom:
            secretKeyRef:
              name: email-credentials
              key: email-app-pass
              optional: true
        livenessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: metrics
    port: {{ .Values.services.notificationService.metricsPort | default 9464 }}
    targetPort: {{ .Values.services.notificationService.metricsPort | default 9464 }}
  selector:
    app: notification-service
