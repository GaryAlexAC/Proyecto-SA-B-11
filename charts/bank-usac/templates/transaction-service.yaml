apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  labels:
    app: transaction-service
spec:
  replicas: {{ .Values.services.transactionService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.services.transactionService.metricsPort | default 9464 | quote }}
    spec:
      containers:
      - name: transaction-service
        image: "{{ .Values.imageRegistry }}/transaction-service:{{ .Values.imageTag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
        envFrom:
        - configMapRef:
            name: observability-env
        ports:
        - containerPort: 3000
        - containerPort: {{ .Values.services.transactionService.metricsPort | default 9464 }}
          name: metrics
        env:
        - name: DATABASE_URL
          value: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password | urlquery }}@{{ .Values.database.host }}:{{ .Values.database.port }}/db_transaction?schema={{ .Values.database.schema }}"
        - name: RABBITMQ_URL
          value: "amqp://{{ .Values.rabbitmq.user }}:{{ .Values.rabbitmq.password }}@{{ .Values.rabbitmq.host }}:{{ .Values.rabbitmq.port }}"
        - name: JWT_SECRET
          value: {{ .Values.jwt.secret | quote }}
        - name: FORCE_OUTBOX_FAILURE
          value: {{ .Values.testFaultInjection.forceOutboxFailure | default "false" | quote }}
        - name: FORCE_OUTBOX_FAILURE_EVENT
          value: {{ .Values.testFaultInjection.forceOutboxFailureEvent | default "" | quote }}
        livenessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: metrics
    port: {{ .Values.services.transactionService.metricsPort | default 9464 }}
    targetPort: {{ .Values.services.transactionService.metricsPort | default 9464 }}
  selector:
    app: transaction-service
