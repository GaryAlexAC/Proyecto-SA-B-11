apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: {{ .Values.services.paymentService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.services.paymentService.metricsPort | default 9464 | quote }}
    spec:
      containers:
      - name: payment-service
        image: "{{ .Values.imageRegistry }}/payment-service:{{ .Values.imageTag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
        envFrom:
        - configMapRef:
            name: observability-env
        ports:
        - containerPort: 3000
        - containerPort: {{ .Values.services.paymentService.metricsPort | default 9464 }}
          name: metrics
        env:
        - name: DATABASE_URL
          value: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password | urlquery }}@{{ .Values.database.host }}:{{ .Values.database.port }}/db_payment?schema={{ .Values.database.schema }}"
        - name: RABBITMQ_URL
          value: "amqp://{{ .Values.rabbitmq.user }}:{{ .Values.rabbitmq.password }}@{{ .Values.rabbitmq.host }}:{{ .Values.rabbitmq.port }}"
        - name: JWT_SECRET
          value: {{ .Values.jwt.secret | quote }}
        - name: BANK_CODE
          value: {{ .Values.interbank.bankCode | default "BANK11" | quote }}
        - name: PARTNER_BANK_CODE
          value: {{ .Values.interbank.partnerBankCode | default "BANK06" | quote }}
        - name: PARTNER_BANK_URL
          value: {{ .Values.interbank.partnerBankUrl | default "http://100.52.78.200:30080" | quote }}
        - name: PARTNER_API_KEY
          value: {{ .Values.interbank.partnerApiKey | default "bank06-partner-key-2026" | quote }}
        - name: INTERBANK_API_KEY
          value: {{ .Values.interbank.myApiKey | default "bank11-partner-key-2026" | quote }}
        - name: INTERBANK_MOCK_ENABLED
          value: {{ .Values.interbank.mockEnabled | default "false" | quote }}
        livenessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: metrics
    port: {{ .Values.services.paymentService.metricsPort | default 9464 }}
    targetPort: {{ .Values.services.paymentService.metricsPort | default 9464 }}
  selector:
    app: payment-service
