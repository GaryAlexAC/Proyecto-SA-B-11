apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            tags: [service.name, deployment.environment]
          serviceMap:
            datasourceUid: prometheus
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Bank USAC
        orgId: 1
        folder: Bank USAC
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  bank-usac-overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {"type": "stat", "title": "Errores por minuto", "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}, "targets": [{"expr": "sum(rate(bank_errors_total[5m])) or vector(0)", "refId": "A"}]},
        {"type": "stat", "title": "Throughput", "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}, "targets": [{"expr": "sum(rate(bank_requests_total[5m])) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Latencia p95", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(transaction_duration_ms_bucket[5m]))) or vector(0)", "refId": "A"}]},
        {"type": "timeseries", "title": "Anomalías de cuentas", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}, "targets": [{"expr": "sum by (operation) (increase(account_anomalies_detected_total[1h])) or vector(0)", "refId": "A"}]}
      ],
      "schemaVersion": 39,
      "title": "Bank USAC - Estado y SLI",
      "uid": "bank-usac-overview",
      "version": 1
    }
