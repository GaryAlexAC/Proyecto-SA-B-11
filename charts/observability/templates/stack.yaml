apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-env
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  ENVIRONMENT: {{ .Values.environment | default "dev" | quote }}
  IMAGE_VERSION: {{ .Values.imageVersion | default "v1.0.0" | quote }}
  METRICS_PORT: "9464"
  ACCOUNT_ANOMALY_THRESHOLD: {{ .Values.observabilityEnv.accountAnomalyThreshold | default "10" | quote }}
  ACCOUNT_ANOMALY_WINDOW_MINUTES: {{ .Values.observabilityEnv.accountAnomalyWindowMinutes | default "5" | quote }}
  PAYMENT_FAILURE_RATE_PERCENT: {{ .Values.observabilityEnv.paymentFailureRatePercent | default "20" | quote }}
  PAYMENT_TIMEOUT_RATE_PERCENT: {{ .Values.observabilityEnv.paymentTimeoutRatePercent | default "10" | quote }}
  PAYMENT_LATENCY_MS: {{ .Values.observabilityEnv.paymentLatencyMs | default "0" | quote }}
  PAYMENT_TIMEOUT_MS: {{ .Values.observabilityEnv.paymentTimeoutMs | default "3000" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include: [/var/log/pods/*/*/*.log]
        start_at: end
        operators:
          - type: json_parser
            id: parse-json
            parse_from: body
    processors:
      batch: {}
    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [filelog]
          processors: [batch]
          exporters: [otlphttp/loki]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/rules.yaml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager:9093]
    scrape_configs:
      - job_name: bank-usac-services
        static_configs:
          - targets:
              - api-gateway:9464
              - customer-service:9464
              - account-service:9464
              - transaction-service:9464
              - payment-service:9464
              - notification-service:9464
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      - job_name: rabbitmq
        static_configs:
          - targets: [rabbitmq-exporter:9419]
  rules.yaml: |
    groups:
      - name: bank-usac-sre
        rules:
          - alert: BankHighErrorRate
            expr: sum(rate(bank_errors_total[5m])) / clamp_min(sum(rate(bank_requests_total[5m])), 1) > 0.05
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "La tasa de errores del banco supera el 5%"
              runbook: "docs/runbooks/high-error-rate.md"
          - alert: BankHighTransactionLatency
            expr: histogram_quantile(0.95, sum by (le) (rate(transaction_duration_ms_bucket[5m]))) > 2000
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "El p95 de transacciones supera 2 segundos"
              runbook: "docs/runbooks/high-latency.md"
          - alert: BankConsumerLagHigh
            expr: rabbitmq_queue_messages_ready > 100
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Hay más de 100 mensajes pendientes en RabbitMQ"
              runbook: "docs/runbooks/consumer-lag.md"
          - alert: BankErrorBudgetBurnRate
            expr: (sum(rate(bank_errors_total[1h])) / clamp_min(sum(rate(bank_requests_total[1h])), 1)) > 0.01
            for: 15m
            labels: {severity: critical}
            annotations:
              summary: "El consumo del error budget supera el burn rate permitido"
              runbook: "docs/runbooks/error-budget-burn-rate.md"
          - alert: BankEventProcessingSLO
            expr: sum(rate(bank_event_processing_duration_ms_bucket{le="5000"}[5m])) / clamp_min(sum(rate(bank_event_processing_duration_ms_count[5m])), 1) < 0.99
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Menos del 99% de los eventos se procesa antes de 5 segundos"
          - alert: BankDlqRateHigh
            expr: sum(rate(bank_events_dlq_total[5m])) / clamp_min(sum(rate(bank_events_published_total[5m])), 1) > 0.005
            for: 10m
            labels: {severity: critical}
            annotations:
              summary: "La tasa de eventos enviados a la DLQ lógica supera 0.5%"
          - alert: BankNotificationProcessingSLO
            expr: sum(rate(bank_notification_processing_duration_ms_bucket{le="30000"}[5m])) / clamp_min(sum(rate(bank_notification_processing_duration_ms_count[5m])), 1) < 0.95
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Menos del 95% de las notificaciones se procesa antes de 30 segundos"
          - alert: BankReadLatencySLO
            expr: histogram_quantile(0.95, sum by (le) (rate(bank_operation_duration_ms_bucket{service_name="api-gateway",operation=~"GET .*"}[5m]))) > 500
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "La latencia p95 de requests de lectura supera 500 ms"
          - alert: BankOperationCreationLatencySLO
            expr: histogram_quantile(0.95, sum by (le) (rate(bank_operation_duration_ms_bucket{service_name="api-gateway",operation=~"POST .*|PUT .*|PATCH .*"}[5m]))) > 1000
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "La latencia p95 de creación de operaciones supera 1 segundo"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: {}
            http: {}
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo
    compactor:
      compaction:
        block_retention: 168h
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
      allow_structured_metadata: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.119.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          volumeMounts:
            - {name: config, mountPath: /conf}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
        - name: pod-logs
          hostPath: {path: /var/log/pods}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: ["extensions", "apps"]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: bank-usac-visible-channel
    receivers:
      - name: bank-usac-visible-channel
        webhook_configs:
          - url: http://api-gateway:3000/api/alerts/webhook
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports: [{name: http, containerPort: 9093}]
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager}
      volumes:
        - name: config
          configMap: {name: alertmanager-config}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector: {app: alertmanager}
  ports: [{name: http, port: 9093, targetPort: 9093}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-exporter
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq-exporter}
  template:
    metadata:
      labels: {app: rabbitmq-exporter}
    spec:
      containers:
        - name: rabbitmq-exporter
          image: kbudde/rabbitmq-exporter:1.0.0
          env:
            - {name: RABBIT_URL, value: http://rabbitmq:15672}
            - {name: RABBIT_USER, value: guest}
            - {name: RABBIT_PASSWORD, value: guest}
          ports: [{name: metrics, containerPort: 9419}]
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-exporter
spec:
  selector: {app: rabbitmq-exporter}
  ports: [{name: metrics, port: 9419, targetPort: 9419}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  selector:
    matchLabels: {app: tempo}
  template:
    metadata:
      labels: {app: tempo}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports: [{name: http, containerPort: 3200}, {name: grpc, containerPort: 4317}]
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: tempo-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector: {app: tempo}
  ports: [{name: http, port: 3200, targetPort: 3200}, {name: grpc, port: 4317, targetPort: 4317}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.1
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{name: http, containerPort: 3100}]
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector: {app: loki}
  ports: [{name: http, port: 3100, targetPort: 3100}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
          ports: [{name: http, containerPort: 3000}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards/bank-usac-overview.json, subPath: bank-usac-overview.json}
      volumes:
        - name: data
          emptyDir: {}
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: {{ .Values.service.grafana.type | default "LoadBalancer" }}
  selector: {app: grafana}
  ports: [{name: http, port: 3000, targetPort: 3000}]
