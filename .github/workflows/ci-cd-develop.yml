name: CI+CD — Develop Branch

# Se dispara en push/merge a develop o feature/201700936_fase3, o manualmente
on:
  push:
    branches:
      - develop
      - feature/201700936_fase3
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev/project-de5dd415-1a0b-4df8-8a8/bank-usac
  GKE_CLUSTER: bank-usac-cluster
  GKE_ZONE: us-central1-a
  WIF_PROVIDER: projects/287795054140/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: sa-terraform@project-de5dd415-1a0b-4df8-8a8.iam.gserviceaccount.com

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=packages/observability
      - run: npm run prebuild --workspaces --if-present
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=packages/observability
      - run: npm run prebuild --workspaces --if-present
      - run: npm run test --workspaces --if-present

  docker-build-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: apps/api-gateway/Dockerfile
          - service: account-service
            dockerfile: apps/account-service/Dockerfile
          - service: customer-service
            dockerfile: apps/customer-service/Dockerfile
          - service: transaction-service
            dockerfile: apps/transaction-service/Dockerfile
          - service: payment-service
            dockerfile: apps/payment-service/Dockerfile
          - service: notification-service
            dockerfile: apps/notification-service/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build y Push
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ matrix.service }}:dev-${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ matrix.service }}:dev-latest \
            -f ${{ matrix.dockerfile }} .
          docker push ${{ env.REGISTRY }}/${{ matrix.service }}:dev-${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ matrix.service }}:dev-latest

  deploy-dev:
    name: Deploy to GKE with Helm (dev)
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Desplegar stack de observabilidad con Helm
        run: |
          helm upgrade --install bank-observability ./charts/observability \
            --namespace dev --create-namespace \
            --set environment=dev \
            --set imageVersion=dev-${{ github.sha }}

      - name: Desplegar microservicios de Bank USAC con Helm
        run: |
          helm upgrade --install bank-usac ./charts/bank-usac \
            --namespace dev --create-namespace \
            --set environment=dev \
            --set imageTag=dev-${{ github.sha }} \
            --set imageRegistry=${{ env.REGISTRY }}

      - name: Limpiar pods en estado Terminating colgados
        run: |
          kubectl get pods -n dev --no-headers 2>/dev/null | awk '$3 ~ /Terminating/ {print $1}' | while read -r pod; do
            if [ -n "$pod" ]; then
              echo "🧹 Forzando eliminación de pod colgado en Terminating: $pod"
              kubectl delete pod "$pod" -n dev --grace-period=0 --force || true
            fi
          done

      - name: Verificar rollout de servicios
        run: |
          for service in rabbitmq api-gateway account-service customer-service transaction-service payment-service notification-service frontend; do
            echo "⏳ Verificando rollout de $service..."
            kubectl rollout status deployment/$service -n dev --timeout=300s
            echo "✅ $service desplegado correctamente"
          done

      - name: Mostrar URLs e IPs públicas de acceso
        run: |
          echo "=== SERVICIOS Y DIRECCIONES IP PÚBLICAS ==="
          kubectl get svc -n dev
          echo ""
          echo "=== PODS EN DEV ==="
          kubectl get pods -n dev

      - name: Diagnóstico si falla el despliegue
        if: failure()
        run: |
          echo "=== ESTADO DE PODS ==="
          kubectl get pods -n dev -o wide
          echo ""
          echo "=== DESCRIBIR DEPLOYMENT Y PODS DE API-GATEWAY ==="
          kubectl describe deployment/api-gateway -n dev || true
          kubectl get pods -n dev -l app=api-gateway -o name 2>/dev/null | while read -r pod; do
            echo "--- DESCRIBE $pod ---"
            kubectl describe "$pod" -n dev | tail -n 35
            echo "--- LOGS $pod ---"
            kubectl logs "$pod" -n dev --tail=40 || true
          done
          echo ""
          echo "=== EVENTOS RECIENTES ==="
          kubectl get events -n dev --sort-by='.lastTimestamp' | tail -n 30
