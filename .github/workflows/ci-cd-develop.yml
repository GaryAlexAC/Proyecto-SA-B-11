name: CI+CD — Develop Branch

# Se dispara en push/merge a develop o feature/201700936_fase3, o manualmente
on:
  push:
    branches:
      - develop
      - feature/201700936_fase3
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev/project-de5dd415-1a0b-4df8-8a8/bank-usac
  GKE_CLUSTER: bank-usac-cluster
  GKE_ZONE: us-central1-a
  WIF_PROVIDER: projects/287795054140/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: sa-terraform@project-de5dd415-1a0b-4df8-8a8.iam.gserviceaccount.com

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      account-service: ${{ steps.filter.outputs.account-service }}
      customer-service: ${{ steps.filter.outputs.customer-service }}
      transaction-service: ${{ steps.filter.outputs.transaction-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'apps/api-gateway/**'
              - 'packages/observability/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            account-service:
              - 'apps/account-service/**'
              - 'packages/observability/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            customer-service:
              - 'apps/customer-service/**'
              - 'packages/observability/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            transaction-service:
              - 'apps/transaction-service/**'
              - 'packages/observability/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            payment-service:
              - 'apps/payment-service/**'
              - 'packages/observability/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            notification-service:
              - 'apps/notification-service/**'
              - 'packages/observability/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=packages/observability
      - run: npm run prebuild --workspaces --if-present
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=packages/observability
      - run: npm run prebuild --workspaces --if-present
      - run: npm run test --workspaces --if-present

  docker-build-push:
    name: Docker Build & Push (dev)
    runs-on: ubuntu-latest
    needs: [test, changes]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build y Push — api-gateway
        if: needs.changes.outputs.api-gateway == 'true'
        run: |
          IMAGE=${{ env.REGISTRY }}/api-gateway:dev-${{ github.sha }}
          docker build -t $IMAGE -f apps/api-gateway/Dockerfile .
          docker push $IMAGE

      - name: Build y Push — account-service
        if: needs.changes.outputs.account-service == 'true'
        run: |
          IMAGE=${{ env.REGISTRY }}/account-service:dev-${{ github.sha }}
          docker build -t $IMAGE -f apps/account-service/Dockerfile .
          docker push $IMAGE

      - name: Build y Push — customer-service
        if: needs.changes.outputs.customer-service == 'true'
        run: |
          IMAGE=${{ env.REGISTRY }}/customer-service:dev-${{ github.sha }}
          docker build -t $IMAGE -f apps/customer-service/Dockerfile .
          docker push $IMAGE

      - name: Build y Push — transaction-service
        if: needs.changes.outputs.transaction-service == 'true'
        run: |
          IMAGE=${{ env.REGISTRY }}/transaction-service:dev-${{ github.sha }}
          docker build -t $IMAGE -f apps/transaction-service/Dockerfile .
          docker push $IMAGE

      - name: Build y Push — payment-service
        if: needs.changes.outputs.payment-service == 'true'
        run: |
          IMAGE=${{ env.REGISTRY }}/payment-service:dev-${{ github.sha }}
          docker build -t $IMAGE -f apps/payment-service/Dockerfile .
          docker push $IMAGE

      - name: Build y Push — notification-service
        if: needs.changes.outputs.notification-service == 'true'
        run: |
          IMAGE=${{ env.REGISTRY }}/notification-service:dev-${{ github.sha }}
          docker build -t $IMAGE -f apps/notification-service/Dockerfile .
          docker push $IMAGE

      - name: Build y Push — frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          IMAGE=${{ env.REGISTRY }}/frontend:dev-${{ github.sha }}
          docker build -t $IMAGE -f frontend/Dockerfile .
          docker push $IMAGE

  deploy-dev:
    name: Deploy to GKE with Helm (dev)
    runs-on: ubuntu-latest
    needs: [docker-build-push, changes]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Desplegar stack de observabilidad con Helm
        run: |
          helm upgrade --install bank-observability ./charts/observability \
            --namespace dev --create-namespace \
            --set environment=dev \
            --set imageVersion=dev-${{ github.sha }}

      - name: Desplegar microservicios de Bank USAC con Helm
        run: |
          helm upgrade --install bank-usac ./charts/bank-usac \
            --namespace dev --create-namespace \
            --set environment=dev \
            --set imageTag=dev-${{ github.sha }} \
            --set imageRegistry=${{ env.REGISTRY }}

      - name: Verificar rollout de servicios
        run: |
          kubectl rollout status deployment/rabbitmq -n dev --timeout=180s
          kubectl rollout status deployment/api-gateway -n dev --timeout=300s
          kubectl rollout status deployment/account-service -n dev --timeout=300s
          kubectl rollout status deployment/customer-service -n dev --timeout=300s
          kubectl rollout status deployment/transaction-service -n dev --timeout=300s
          kubectl rollout status deployment/payment-service -n dev --timeout=300s
          kubectl rollout status deployment/notification-service -n dev --timeout=300s
          kubectl rollout status deployment/frontend -n dev --timeout=300s
