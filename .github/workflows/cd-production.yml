name: CD — Deploy a Producción

# Se dispara SOLO en merge a main
on:
  push:
    branches:
      - main

env:
  REGISTRY: us-central1-docker.pkg.dev/project-de5dd415-1a0b-4df8-8a8/bank-usac
  GKE_CLUSTER: bank-usac-cluster
  GKE_ZONE: us-central1-a
  WIF_PROVIDER: projects/287795054140/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: sa-terraform@project-de5dd415-1a0b-4df8-8a8.iam.gserviceaccount.com

jobs:
  deploy-production:
    name: Rolling Update en Producción
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Obtener versión del último release
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🏷️  Desplegando versión: $VERSION"

      - name: Desplegar stack de observabilidad en producción con Helm
        run: |
          helm upgrade --install bank-observability ./charts/observability \
            --namespace prod --create-namespace \
            --set environment=prod \
            --set imageVersion=${{ steps.get_version.outputs.version }}

      - name: Desplegar microservicios en producción con Helm
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          helm upgrade --install bank-usac ./charts/bank-usac \
            -f ./charts/bank-usac/values-prod.yaml \
            --namespace prod --create-namespace \
            --set imageTag=$VERSION \
            --set imageRegistry=${{ env.REGISTRY }}

      - name: Verificar rollout exitoso
        run: |
          for service in rabbitmq api-gateway account-service customer-service transaction-service payment-service notification-service frontend; do
            echo "⏳ Verificando rollout de $service..."
            kubectl rollout status deployment/$service -n prod --timeout=300s
            echo "✅ $service desplegado correctamente"
          done

      - name: Mostrar estado final de pods
        run: kubectl get pods -n prod
