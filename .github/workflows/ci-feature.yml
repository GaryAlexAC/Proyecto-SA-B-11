name: CI — Feature Branch

# Se dispara en push a cualquier rama feature/*
on:
  push:
    branches:
      - "feature/**"

jobs:
  # ──────────────────────────────────────
  # JOB 1: Build — Compilar el proyecto
  # ──────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar todos los microservicios
        run: npm run build --workspaces --if-present

  # ──────────────────────────────────────
  # JOB 2: Test — Ejecutar pruebas
  # ──────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build # Solo corre si build fue exitoso
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm run test --workspaces --if-present

  # ──────────────────────────────────────
  # JOB 3: Validate — Sanity check
  # ──────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: test # Solo corre si test fue exitoso
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar lint
        run: npm run lint --workspaces --if-present

      - name: Verificar Dockerfiles existen
        run: |
          for service in api-gateway account-service customer-service transaction-service payment-service notification-service; do
            if [ ! -f "apps/$service/Dockerfile" ]; then
              echo "ERROR: Dockerfile faltante en apps/$service/"
              exit 1
            fi
            echo "✅ apps/$service/Dockerfile encontrado"
          done
          test -f frontend/Dockerfile
          echo "✅ frontend/Dockerfile encontrado"
