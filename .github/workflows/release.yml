name: Release — Build Imágenes Versionadas

# Se dispara en ramas release/* o en tags vX.X.X
on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}

jobs:
  # ──────────────────────────────────────
  # Determinar la versión del release
  # ──────────────────────────────────────
  version:
    name: Determinar Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Obtener versión del tag o rama
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Si es rama release/v1.1.0 → extraemos v1.1.0
            VERSION="${GITHUB_REF#refs/heads/release/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🏷️  Versión detectada: $VERSION"

  # ──────────────────────────────────────
  # Build y Push imágenes versionadas
  # ──────────────────────────────────────
  build-and-publish:
    name: Build & Publish Imágenes (${{ needs.version.outputs.version }})
    runs-on: ubuntu-latest
    needs: version
    env:
      API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend production configuration
        shell: bash
        run: |
          if [[ ! "$API_GATEWAY_URL" =~ ^https:// ]]; then
            echo "Configure API_GATEWAY_URL_PROD with the public HTTPS URL of the production API Gateway."
            exit 1
          fi

      - name: Autenticar en GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GKE_REGION }}-docker.pkg.dev --quiet

      - name: Build y Push imágenes con versión
        run: |
          VERSION=${{ needs.version.outputs.version }}
          for service in api-gateway account-service customer-service transaction-service payment-service notification-service; do
            IMAGE=${{ env.REGISTRY }}/$service:$VERSION
            echo "📦 Building $IMAGE"
            docker build -t $IMAGE -f apps/$service/Dockerfile .
            docker push $IMAGE
            echo "✅ $IMAGE publicada"
          done

          FRONTEND_IMAGE=${{ env.REGISTRY }}/frontend:$VERSION
          echo "📦 Building $FRONTEND_IMAGE"
          docker build \
            --build-arg "VITE_API_GATEWAY_URL=$API_GATEWAY_URL" \
            -t $FRONTEND_IMAGE \
            -f frontend/Dockerfile .
          docker push $FRONTEND_IMAGE
          echo "✅ $FRONTEND_IMAGE publicada"

      - name: Crear GitHub Release (solo para tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.version }}
          release_name: "Release ${{ needs.version.outputs.version }}"
          body: |
            ## Bank USAC — Release ${{ needs.version.outputs.version }}
            Imágenes publicadas en Artifact Registry:
            - `api-gateway:${{ needs.version.outputs.version }}`
            - `account-service:${{ needs.version.outputs.version }}`
            - `customer-service:${{ needs.version.outputs.version }}`
            - `transaction-service:${{ needs.version.outputs.version }}`
            - `payment-service:${{ needs.version.outputs.version }}`
            - `notification-service:${{ needs.version.outputs.version }}`
            - `frontend:${{ needs.version.outputs.version }}`
          draft: false
          prerelease: false
