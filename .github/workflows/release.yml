name: Release — Build Imágenes Versionadas

# Se dispara en ramas release/* o en tags vX.X.X
on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"

env:
  REGISTRY: us-central1-docker.pkg.dev/project-de5dd415-1a0b-4df8-8a8/bank-usac
  WIF_PROVIDER: projects/287795054140/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: sa-terraform@project-de5dd415-1a0b-4df8-8a8.iam.gserviceaccount.com

permissions:
  contents: write
  id-token: write

jobs:
  # ──────────────────────────────────────
  # Determinar la versión del release
  # ──────────────────────────────────────
  version:
    name: Determinar Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Obtener versión del tag o rama
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Si es rama release/v1.1.0 → extraemos v1.1.0
            VERSION="${GITHUB_REF#refs/heads/release/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🏷️  Versión detectada: $VERSION"

  # ──────────────────────────────────────
  # Build y Push imágenes versionadas
  # ──────────────────────────────────────
  build-and-publish:
    name: Build & Publish Imágenes
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build y Push imágenes con versión
        run: |
          VERSION=${{ needs.version.outputs.version }}
          for service in api-gateway account-service customer-service transaction-service payment-service notification-service; do
            IMAGE=${{ env.REGISTRY }}/$service:$VERSION
            echo "📦 Building $IMAGE"
            docker build -t $IMAGE -f apps/$service/Dockerfile .
            docker push $IMAGE
            echo "✅ $IMAGE publicada"
          done
          # Frontend build
          IMAGE=${{ env.REGISTRY }}/frontend:$VERSION
          echo "📦 Building $IMAGE"
          docker build -t $IMAGE -f frontend/Dockerfile .
          docker push $IMAGE
          echo "✅ $IMAGE publicada"

      - name: Crear GitHub Release (solo para tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: "Release ${{ needs.version.outputs.version }}"
          body: |
            ## Bank USAC — Release ${{ needs.version.outputs.version }}
            Imágenes publicadas en Google Artifact Registry:
            - `api-gateway:${{ needs.version.outputs.version }}`
            - `account-service:${{ needs.version.outputs.version }}`
            - `customer-service:${{ needs.version.outputs.version }}`
            - `transaction-service:${{ needs.version.outputs.version }}`
            - `payment-service:${{ needs.version.outputs.version }}`
            - `notification-service:${{ needs.version.outputs.version }}`
            - `frontend:${{ needs.version.outputs.version }}`
          draft: false
          prerelease: false
