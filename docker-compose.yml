services:
  postgres:
    image: postgres:15-alpine
    container_name: bank_usac_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      # Esta es la BD por defecto, pero el script creará las otras 5
      POSTGRES_DB: bank_usac_default 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bank_usac_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
