services:
  postgres:
    image: postgres:15-alpine
    container_name: bank_usac_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: bank_usac_default
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bank-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bank_usac_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - bank-network

  customer-service:
    build:
      context: .
      dockerfile: apps/customer-service/Dockerfile
    image: bank-usac/customer-service:latest
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/db_customer?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-before-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ACTIVATION_URL_BASE: ${ACTIVATION_URL_BASE:-http://localhost:5173/}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
      ADMIN_NAME: ${ADMIN_NAME:-Bank USAC Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bankusac.local}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bank-network

  account-service:
    build:
      context: .
      dockerfile: apps/account-service/Dockerfile
    image: bank-usac/account-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/db_account?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-before-production}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bank-network

  transaction-service:
    build:
      context: .
      dockerfile: apps/transaction-service/Dockerfile
    image: bank-usac/transaction-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/db_transaction?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-before-production}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      account-service:
        condition: service_started
    networks:
      - bank-network

  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    image: bank-usac/payment-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/db_payment?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-before-production}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bank-network

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    image: bank-usac/notification-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/db_notification?schema=public
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bank-network

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    image: bank-usac/api-gateway:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq:5672
      CUSTOMER_SERVICE_HTTP_URL: http://customer-service:3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      payment-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bank-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:3000}
    image: bank-usac/frontend:latest
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - bank-network

volumes:
  postgres_data:

networks:
  bank-network:
    driver: bridge
