groups:
  - name: bank-usac-sre
    rules:
      - alert: BankHighErrorRate
        expr: sum(rate(bank_errors_total[5m])) / clamp_min(sum(rate(bank_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "La tasa de errores del banco supera el 5%"
          runbook: "docs/runbooks/high-error-rate.md"
      - alert: BankHighTransactionLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(transaction_duration_ms_bucket[5m]))) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "El p95 de transacciones supera 2 segundos"
          runbook: "docs/runbooks/high-latency.md"
      - alert: BankConsumerLagHigh
        expr: rabbitmq_queue_messages_ready > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hay más de 100 mensajes pendientes en RabbitMQ"
          runbook: "docs/runbooks/consumer-lag.md"
      - alert: BankErrorBudgetBurnRate
        expr: (sum(rate(bank_errors_total[1h])) / clamp_min(sum(rate(bank_requests_total[1h])), 1)) > 0.01
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "El consumo del error budget supera el burn rate permitido"
          runbook: "docs/runbooks/error-budget-burn-rate.md"
      - alert: PaymentExternalFailuresHigh
        expr: sum(rate(payment_external_failures_total[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Payment Service detecta muchos fallos externos simulados"
          runbook: "docs/runbooks/payment-simulation.md"
      - alert: BankEventProcessingSLO
        expr: sum(rate(bank_event_processing_duration_ms_bucket{le="5000"}[5m])) / clamp_min(sum(rate(bank_event_processing_duration_ms_count[5m])), 1) < 0.99
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Menos del 99% de los eventos se procesa antes de 5 segundos"
      - alert: BankDlqRateHigh
        expr: sum(rate(bank_events_dlq_total[5m])) / clamp_min(sum(rate(bank_events_published_total[5m])), 1) > 0.005
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "La tasa de eventos enviados a la DLQ lógica supera 0.5%"
      - alert: BankNotificationProcessingSLO
        expr: sum(rate(bank_notification_processing_duration_ms_bucket{le="30000"}[5m])) / clamp_min(sum(rate(bank_notification_processing_duration_ms_count[5m])), 1) < 0.95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Menos del 95% de las notificaciones se procesa antes de 30 segundos"
      - alert: BankReadLatencySLO
        expr: histogram_quantile(0.95, sum by (le) (rate(bank_operation_duration_ms_bucket{service_name="api-gateway",operation=~"GET .*"}[5m]))) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "La latencia p95 de requests de lectura supera 500 ms"
      - alert: BankOperationCreationLatencySLO
        expr: histogram_quantile(0.95, sum by (le) (rate(bank_operation_duration_ms_bucket{service_name="api-gateway",operation=~"POST .*|PUT .*|PATCH .*"}[5m]))) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "La latencia p95 de creación de operaciones supera 1 segundo"
