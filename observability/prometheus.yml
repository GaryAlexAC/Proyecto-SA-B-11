global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: bank-usac-services
    static_configs:
      - targets:
          - api-gateway:9464
          - customer-service:9464
          - account-service:9464
          - transaction-service:9464
          - payment-service:9464
          - notification-service:9464
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq-exporter:9419]
